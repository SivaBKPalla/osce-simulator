name: Keep Render awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake API and website
        env:
          API_URL: https://osce-simulator-api.onrender.com/api/health
          WEB_URL: https://osce-simulator-web.onrender.com/api/health
        run: |
          curl -fsS --retry 10 --retry-delay 8 --retry-all-errors --max-time 45 "$API_URL"
          curl -fsS --retry 10 --retry-delay 8 --retry-all-errors --max-time 45 "$WEB_URL"
